  <g transform="translate(54 54) scale(1.3) translate(-54 -54)">
    <g fill="none" stroke="#FFFFFF" stroke-width="5">
      <circle cx="54" cy="54" r="24"/>
      <circle cx="54" cy="54" r="13.5"/>
    </g>
    <circle cx="54" cy="54" r="5" fill="#FFD84A"/>
  </g>
</svg>
