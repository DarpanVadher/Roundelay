[package]
name = "mpsp-engine"
version.workspace = true
edition = "2021"

[dependencies]
mpsp-core = { path = "../mpsp-core" }
cpal = "0.15"
opus = "0.3"
anyhow = "1"
snow = "0.9"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"

# Windows only: read this app's own volume/mute state from the Windows audio session API (same `windows` version
# cpal already uses, so there is one copy).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.54", features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_UI_Shell_PropertiesSystem",
] }
